[project]
name = "voice-pc-agent"
version = "0.1.0"
description = "Offline-first voice control for Windows 11, with cloud intent resolution as an optional assist."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.0",
    "openwakeword>=0.6",
    "sounddevice>=0.4.6",
    "webrtcvad-wheels>=2.0.12",
]
cloud = ["groq>=0.11"]
windows = ["pywin32>=306; sys_platform == 'win32'", "pyautogui>=0.9.54"]
ui = ["PySide6>=6.7"]
# Pinned: the Windows build was verified with exactly this version (scripts/build_windows.ps1).
build = ["pyinstaller==6.22.3"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[project.scripts]
voice-agent = "voice_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers -m 'not slow'"
markers = [
    "slow: excluded from the default developer loop; run with `pytest -m slow` (CI does)",
    "windows: requires a real Windows host",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S", "ARG", "PTH"]
# S101: asserts are the point in tests. B008: FastAPI-style call-in-default, unused here.
# N818: PolicyViolation reads better than PolicyViolationError in the safety docs.
ignore = ["S101", "B008", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "PTH"]
"scripts/**" = ["S", "PTH"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["voice_agent"]
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["voice_agent.core.*", "voice_agent.safety.*"]
disallow_untyped_defs = true
disallow_any_generics = true

[tool.coverage.run]
source = ["src/voice_agent"]
branch = true
