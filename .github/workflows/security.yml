name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" bandit pip-audit detect-secrets

      - name: Static analysis
        run: bandit -r src -ll

      - name: Dependency vulnerabilities
        run: pip-audit || true   # advisory until the dependency set settles

      - name: Secret scan
        run: detect-secrets scan --all-files --force-use-all-plugins > /dev/null

      - name: Safety invariants
        run: python -m pytest -q tests/integration/test_contracts.py

      - name: No committed secrets
        run: |
          ! grep -rnE "gsk_[A-Za-z0-9]{20,}" --include="*.py" --include="*.yaml" \
            --include="*.yml" --include="*.md" . \
            || (echo "possible API key committed" && exit 1)
