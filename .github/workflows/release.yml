name: Release

# Push a tag v<version>, where <version> is voice_agent.__version__ (and pyproject's):
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash # stops at the first failing command; pwsh only checks a step's last one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,voice,cloud,windows,ui,build]"

      - name: Tag matches the package version
        run: |
          version=$(python -c "import voice_agent; print(voice_agent.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match voice_agent.__version__ $version"
            exit 1
          fi

      - name: Gate
        run: |
          python -m pytest -q
          python -m pytest -q -m slow
          ruff check .
          ruff format --check .
          mypy src

      - name: Build and smoke-test on a clean profile
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1 -SkipTests

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\VoicePCAgent -DestinationPath "VoicePCAgent-$env:GITHUB_REF_NAME-win64.zip"

      - name: Checksum
        id: package
        run: |
          zip="VoicePCAgent-$GITHUB_REF_NAME-win64.zip"
          sha256sum "$zip" > SHA256SUMS.txt
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 SHA256SUMS.txt)" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.zip }}
            SHA256SUMS.txt
          body: |
            ## Install

            1. Download `${{ steps.package.outputs.zip }}` and check that its SHA-256 is
               `${{ steps.package.outputs.sha256 }}`. In PowerShell:
               `Get-FileHash .\${{ steps.package.outputs.zip }}`
            2. Unzip it somewhere you can write to, and run `VoicePCAgent\VoicePCAgent.exe`.
               It starts in the system tray. Say "Hey Jarvis", then a command.

            This build is unsigned, so Windows SmartScreen warns on first launch. On first run
            it downloads the speech and wake-word models once (from Hugging Face and GitHub);
            after that it starts offline.

            ## Privacy

            - Audio never leaves your PC and is never written to disk. While muted, it is
              dropped as it arrives.
            - The wake word, speech recognition and every listed command run on your PC.
            - Only when a phrase matches no listed command, the cloud is on, and you have
              added your own Groq API key, two things go to Groq: the transcript (at most
              500 characters) and the list of commands, plus standard request metadata
              (your IP address; OS, Python and SDK versions). Nothing about your files or
              other apps.
            - What you say is not saved unless you turn on `privacy.store_transcripts`. The
              audit log keeps it only as a keyed hash, unless you set both
              `privacy.store_transcripts: true` and `privacy.redact_sensitive_logs: false`.
            - Your API key is kept in Windows Credential Manager. This build contains no key:
              the build fails if its sources or its output contain anything key-shaped.
            - No telemetry, analytics or crash reporting.

            Full details: [docs/privacy.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/privacy.md)
