  - {say: "Select all.", expect: edit.select_all}
  - {say: "Save the file.", expect: edit.save}
  - {say: "Print this page.", expect: edit.print}
  - {say: "Scroll down.", expect: page.down}
  - {say: "Page up.", expect: page.up}
  - {say: "Go to the top.", expect: page.top}
  - {say: "Scroll to the bottom.", expect: page.bottom}
  - {say: "Show desktop.", expect: desktop.show}
  - {say: "Minimize everything.", expect: desktop.minimize_all}
  - {say: "Open Start menu.", expect: desktop.start_menu}
  - {say: "Open File Explorer.", expect: desktop.file_explorer}
  - {say: "Open Windows settings.", expect: desktop.settings}
  - {say: "Take a screenshot.", expect: desktop.screenshot}
  - {say: "Open Task Manager.", expect: desktop.task_manager}
  - {say: "Task view.", expect: desktop.task_view}
  - {say: "Next desktop.", expect: desktop.next_desktop}
  - {say: "Previous desktop.", expect: desktop.previous_desktop}
  - {say: "Show notifications.", expect: desktop.notifications}
  - {say: "Clipboard history.", expect: desktop.clipboard}
  - {say: "Zoom in.", expect: zoom.in}
