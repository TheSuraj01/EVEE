# Same meaning, different words. The local matcher should pass these to the cloud model
# rather than guess; only `--cloud` can score them properly.
paraphrase:
  - {say: "Open YouTube in a new tab.", expect: web.open}
  - {say: "Go to github in another tab.", expect: web.open}
  - {say: "Go to next tab.", expect: browser.next_tab}
  - {say: "Go to the tab on the right.", expect: browser.next_tab}
  - {say: "Show me the next tab over.", expect: browser.next_tab}
  - {say: "Move one tab to the right.", expect: browser.next_tab}
  - {say: "Go to the tab on the left.", expect: browser.previous_tab}
  - {say: "Take me back to the tab before this one.", expect: browser.previous_tab}
  - {say: "Get rid of this tab.", expect: browser.close_tab}
  - {say: "Shut this tab.", expect: browser.close_tab}
  - {say: "Open the tab I just closed.", expect: browser.reopen_tab}
  - {say: "I closed a tab by accident, bring it back.", expect: browser.reopen_tab}
  - {say: "Stop the video.", expect: media.play_pause}
  - {say: "Hold the music for a second.", expect: media.play_pause}
  - {say: "Start playing again.", expect: media.play_pause}
  - {say: "Jump ahead thirty seconds.", expect: media.seek_forward, seconds: 30}
  - {say: "Skip ahead a bit.", expect: media.seek_forward}
  - {say: "Go forward a minute.", expect: media.seek_forward, seconds: 60}
  - {say: "Go back ten seconds.", expect: media.seek_backward, seconds: 10}
  - {say: "I missed that, go back a bit.", expect: media.seek_backward}
  - {say: "Jump back twenty seconds.", expect: media.seek_backward, seconds: 20}
  - {say: "Make it louder.", expect: media.volume_up}
  - {say: "I can't hear it, raise the volume.", expect: media.volume_up}
  - {say: "Crank up the sound.", expect: media.volume_up}
  - {say: "Make it quieter.", expect: media.volume_down}
  - {say: "Lower the volume a little.", expect: media.volume_down}
  - {say: "That's too loud.", expect: media.volume_down}
  - {say: "Kill the sound.", expect: media.mute}
  - {say: "Turn the sound off.", expect: media.mute}
  - {say: "Send this window to the taskbar.", expect: window.minimize}
  - {say: "Get this window out of the way.", expect: window.minimize}
  - {say: "Make this window fill the screen.", expect: window.maximize}
  - {say: "Switch to the other window.", expect: window.focus_next}
  - {say: "Put this window on the left half.", expect: window.snap_left}
  - {say: "Dock this on the right side.", expect: window.snap_right}
  - {say: "Shut this window.", expect: window.close}
  - {say: "Get out of full screen mode.", expect: ui.exit_fullscreen}
  - {say: "Make the video fill the screen.", expect: ui.enter_fullscreen}

# Could mean several commands. The agent should do nothing rather than guess.
ambiguous:
  - "Back."
  - "Next."
  - "Close it."
  - "Stop."
  - "Go."
  - "Skip."
  - "Move it."
  - "Switch."
