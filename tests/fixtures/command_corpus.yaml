# What people say to the agent, and what should happen. Scored by scripts/score_corpus.py
# (and tests/integration/test_command_corpus.py) against the default config: built-ins plus
# the browser, media and window-management plugins.
#
# An entry is either {say, expect[, seconds]} — this should run `expect` — or a bare string,
# meaning nothing should happen. Spelling and punctuation are as Whisper might produce them.

# The registered phrases, as transcribed: casing, punctuation, fillers, a wake word left in,
# a spoken duration. The local matcher alone must get every one (no network).
exact:
  - {say: "Put the PC to sleep.", expect: system.sleep}
  - {say: "Sleep the computer.", expect: system.sleep}
  - {say: "Exit full screen.", expect: ui.exit_fullscreen}
  - {say: "leave full screen", expect: ui.exit_fullscreen}
  - {say: "Get me out of full screen!", expect: ui.exit_fullscreen}
  - {say: "Escape.", expect: ui.exit_fullscreen}
  - {say: "press escape", expect: ui.exit_fullscreen}
  - {say: "Full screen.", expect: ui.enter_fullscreen}
  - {say: "go full screen please", expect: ui.enter_fullscreen}
  - {say: "Make it full-screen.", expect: ui.enter_fullscreen}
  - {say: "Next tab.", expect: browser.next_tab}
  - {say: "switch to next tab", expect: browser.next_tab}
  - {say: "Go to the next tab.", expect: browser.next_tab}
  - {say: "Hey Jarvis, next tab.", expect: browser.next_tab}
  - {say: "Um, next tab.", expect: browser.next_tab}
  - {say: "Previous tab.", expect: browser.previous_tab}
  - {say: "last tab", expect: browser.previous_tab}
  - {say: "Go back a tab.", expect: browser.previous_tab}
  - {say: "Close this tab.", expect: browser.close_tab}
  - {say: "close the tab", expect: browser.close_tab}
  - {say: "Reopen tab.", expect: browser.reopen_tab}
  - {say: "undo close tab", expect: browser.reopen_tab}
  - {say: "Bring that tab back.", expect: browser.reopen_tab}
  - {say: "Play.", expect: media.play_pause}
  - {say: "Pause.", expect: media.play_pause}
  - {say: "resume", expect: media.play_pause}
  - {say: "Play pause.", expect: media.play_pause}
  - {say: "Okay, pause.", expect: media.play_pause}
  - {say: "Seek forward.", expect: media.seek_forward, seconds: 10}
  - {say: "skip forward", expect: media.seek_forward, seconds: 10}
  - {say: "Fast forward.", expect: media.seek_forward, seconds: 10}
  - {say: "Skip forward 30 seconds.", expect: media.seek_forward, seconds: 30}
  - {say: "seek forward thirty seconds", expect: media.seek_forward, seconds: 30}
  - {say: "Fast forward two minutes.", expect: media.seek_forward, seconds: 120}
  - {say: "Seek back.", expect: media.seek_backward, seconds: 10}
  - {say: "seek backward", expect: media.seek_backward, seconds: 10}
  - {say: "Skip back.", expect: media.seek_backward, seconds: 10}
  - {say: "Rewind.", expect: media.seek_backward, seconds: 10}
  - {say: "Rewind 15 seconds.", expect: media.seek_backward, seconds: 15}
  - {say: "skip back five seconds", expect: media.seek_backward, seconds: 5}
  - {say: "Volume up.", expect: media.volume_up}
  - {say: "Louder.", expect: media.volume_up}
  - {say: "turn it up", expect: media.volume_up}
  - {say: "Volume down.", expect: media.volume_down}
  - {say: "quieter", expect: media.volume_down}
  - {say: "Turn it down.", expect: media.volume_down}
  - {say: "Mute.", expect: media.mute}
  - {say: "unmute", expect: media.mute}
  - {say: "Silence.", expect: media.mute}
  - {say: "Minimize this.", expect: window.minimize}
  - {say: "minimise this", expect: window.minimize}
  - {say: "Hide this window.", expect: window.minimize}
  - {say: "Maximize this.", expect: window.maximize}
  - {say: "maximise this", expect: window.maximize}
  - {say: "Make this bigger.", expect: window.maximize}
  - {say: "Next window.", expect: window.focus_next}
  - {say: "switch window", expect: window.focus_next}
  - {say: "Alt tab.", expect: window.focus_next}
  - {say: "Snap left.", expect: window.snap_left}
  - {say: "move this left", expect: window.snap_left}
  - {say: "Snap right.", expect: window.snap_right}
  - {say: "move this right", expect: window.snap_right}
  - {say: "Close this window.", expect: window.close}
  - {say: "close the window", expect: window.close}
  # Near misses Whisper produces; the fuzzy pass should still land them.
  - {say: "Close the tap.", expect: browser.close_tab}
  - {say: "Exit fullscreen.", expect: ui.exit_fullscreen}
  - {say: "Previous tabs.", expect: browser.previous_tab}
  # Everyday commands: browser, editing, pages, desktop, music, zoom.
  - {say: "New tab.", expect: browser.new_tab}
