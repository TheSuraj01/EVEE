id: window-management
name: Window Management
version: 1.0.0
description: Minimise, maximise and close the focused window; switch and snap windows.
entrypoint: plugin.py

# window.manage for minimise/maximise/close; keyboard.shortcut for alt+tab and win+arrows.
permissions:
  - window.manage
  - keyboard.shortcut

commands:
  - intent: window.minimize
    description: Minimise the focused window
    risk: low
    aliases: [minimize this, minimise this, hide this window, minimize the window,
              minimise the window]

  - intent: window.maximize
    description: Maximise the focused window
    risk: low
    aliases: [maximize this, maximise this, make this bigger, maximize the window,
              maximise the window]

  - intent: window.focus_next
    description: Switch to the next window
    risk: low
    aliases: [next window, switch window, alt tab, switch windows, switch to the next window]

  - intent: window.snap_left
    description: Snap the focused window to the left half
    risk: low
    aliases: [snap left, move this left, snap the window left, move the window left]

  - intent: window.snap_right
    description: Snap the focused window to the right half
    risk: low
    aliases: [snap right, move this right, snap the window right, move the window right]

  - intent: window.close
    description: Close the focused window
    risk: high
    aliases: [close this window, close the window]
